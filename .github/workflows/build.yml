name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build UpwellEveryday.exe
        run: |
          pip install pillow pyinstaller
          pyinstaller --onefile --noconsole --name UpwellEveryday --icon "${{ github.workspace }}/windows/icon.ico" --distpath build/dist --workpath build/work --specpath build windows/upwell_everyday.py
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: UpwellEveryday-Setup
          path: dist/UpwellEveryday-Setup.exe

  mac:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            dmg: UpwellEveryday-AppleSilicon.dmg
          - runner: macos-15-intel
            dmg: UpwellEveryday-Intel.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pyinstaller
      - name: Build app and DMG
        run: |
          VERSION=$([ "${{ github.ref_type }}" = tag ] && echo "${{ github.ref_name }}" | sed 's/^v//' || echo 0.0.0) bash mac/build_app.sh "${{ matrix.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dmg }}
          path: dist/${{ matrix.dmg }}

  release:
    if: github.ref_type == 'tag'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/UpwellEveryday-Setup.exe
            out/UpwellEveryday-AppleSilicon.dmg
            out/UpwellEveryday-Intel.dmg
